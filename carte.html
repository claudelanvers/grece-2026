<!DOCTYPE html>
<html>
    <!-- Application iPhone / Android -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grèce 2026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Grèce 2026">
<meta name="theme-color" content="#1565C0">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<head>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>

/* ===========================
   POPUPS DES POI
   =========================== */

.poi-popup {
    min-width: 240px;
    line-height: 1.4;
}

.poi-popup h3 {
    margin: 0 0 6px 0;
    font-size: 18px;
    color: #1f4e79;
}

.poi-popup hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 8px 0;
}

.poi-popup p {
    margin: 0;
}

.poi-popup .etoiles {
    margin-top: 10px;
    font-size: 16px;
}

.poi-popup .duree {
    margin-top: 6px;
    font-weight: bold;
}

.poi-popup .liens {
    margin-top: 12px;
}

.poi-popup .liens a {
    text-decoration: none;
}

.poi-popup .liens a:hover {
    text-decoration: underline;
}
.leaflet-control-zoom a,
.leaflet-control-locate a,
.easy-button-button,
.leaflet-bar a {
    width: 46px !important;
    height: 46px !important;
    line-height: 46px !important;
    font-size: 22px !important;
}

.leaflet-control {
    margin: 12px !important;
}

.leaflet-bar,
.easy-button-container {
    border-radius: 12px !important;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.leaflet-bar a,
.easy-button-button {
    border-radius: 0 !important;
}
/* ===== Panneau de navigation ===== */

.leaflet-top.leaflet-left .leaflet-control {
    margin-bottom: 0 !important;
}

.leaflet-top.leaflet-left .leaflet-control:not(:first-child) {
    margin-top: -1px !important;
}

.leaflet-top.leaflet-left .leaflet-bar,
.leaflet-top.leaflet-left .easy-button-container {
    border-radius: 0 !important;
}

.leaflet-top.leaflet-left .leaflet-control:first-child .leaflet-bar {
    border-radius: 12px 12px 0 0 !important;
}

.leaflet-top.leaflet-left .leaflet-control:last-child .leaflet-bar,
.leaflet-top.leaflet-left .leaflet-control:last-child .easy-button-container {
    border-radius: 0 0 12px 12px !important;
}
/* Fusion visuelle des contrôles */

.leaflet-top .leaflet-control {
    margin-bottom: -1px !important;
}

.leaflet-bar {
    box-shadow: none !important;
}

.leaflet-control {
    box-shadow: 0 2px 8px rgba(0,0,0,0.25) !important;
    border-radius: 12px !important;
}
/* ===========================
   TITRE
   =========================== */

h1 {
    margin: 8px 0;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #1f4e79;
}
/* ===========================
   TITRE
   =========================== */

h1 {
    margin: 8px 0;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #1f4e79;
}
/* ===========================
   BANDEAU TITRE
   =========================== */

.titre-carte {
    width: fit-content;
    margin: 10px auto 8px auto;
    padding: 8px 18px;

    background: rgba(255,255,255,0.92);
    border-radius: 14px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.20);

    font-family: Georgia, serif;
    font-size: 26px;
    font-weight: bold;
    color: #1f4e79;

    user-select: none;
}
/* ==========================================
   OPTIMISATION DES CONTRÔLES POUR iPHONE
   V6.0
========================================== */

/* Boutons +, -, Position, Parcours... */
.leaflet-bar a,
.leaflet-control-locate a,
.easy-button-button {
    width: 48px !important;
    height: 48px !important;
    line-height: 48px !important;
    font-size: 22px !important;
    border-radius: 10px !important;
}

/* Icônes Font Awesome */
.easy-button-button span,
.leaflet-control-locate a span {
    font-size: 22px !important;
}

/* Groupe de boutons */
.leaflet-bar {
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
}

/* Sélecteur des couches */
.leaflet-control-layers-toggle {
    width: 48px !important;
    height: 48px !important;
    background-size: 28px 28px !important;
}

/* Fenêtre des couches */
.leaflet-control-layers-expanded {
    font-size: 17px;
    padding: 12px;
}

.leaflet-control-layers label {
    padding: 6px 0;
}

/* Cases radio et cases à cocher */
.leaflet-control-layers input {
    transform: scale(1.35);
    margin-right: 8px;
}

/* Échelle */
.leaflet-control-scale-line {
    font-size: 14px !important;
    font-weight: bold;
    background: rgba(255,255,255,0.9);
    padding: 2px 8px;
    border-radius: 6px;
}
.stage-icon {
    width: clamp(36px, 6vw, 48px);
    height: clamp(36px, 6vw, 48px);
    border-radius: 50%;
    background: #1565C0;
    border: 2px solid white;
    color: white;
    font-weight: bold;
    font-size: clamp(15px, 2.8vw, 20px);
    font-family: Arial, sans-serif;
    text-align: center;
    line-height: clamp(32px, 5.5vw, 44px);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.version {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;

    background: rgba(255,255,255,0.85);
    color: #555;

    padding: 4px 8px;
    border-radius: 8px;

    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;

    box-shadow: 0 1px 5px rgba(0,0,0,.25);

    pointer-events: none;
}
/* ===========================
   SPLASH SCREEN
=========================== */

#splash {

    position: fixed;
    inset: 0;

    background: linear-gradient(180deg,#1565C0,#0B4A8B);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 99999;

    transition: opacity 0.8s ease;

}

#splash img{

    width:180px;
    height:180px;

    border-radius:36px;

    box-shadow:0 12px 30px rgba(0,0,0,.35);

    margin-bottom:10px;

}

#splash h1{

    margin:25px 0 8px;

    color:white;

    font-family:Arial,sans-serif;

    font-size:34px;

}
#splash h1{

    margin:30px 0 10px;

    color:white;

    font-family:Arial,sans-serif;

    font-size:42px;

    font-weight:bold;

}
#splash p{

    color:white;

    font-size:24px;

}

#splash small{

    margin-top:25px;

    color:#dbe9ff;

    font-size:16px;

}
</style>
<title>Carte Grèce 2026</title>

</head>
<body>
<div id="splash">

    <img src="icons/icon-512.png">

    <h1>🇬🇷 Grèce 2026</h1>

    <p>Le Péloponnèse à vélo</p>

    <small>Version 6.1</small>

</div>
<div class="titre-carte">
    🇬🇷 Grèce 2026
</div>

<div id="map" style="height:92vh; width:100%;"></div>

<div class="version">
    V6.1
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/leaflet-gpx@2.1.2/gpx.min.js"></script>

<script src="js/map.js"></script>
<script>

window.addEventListener("load", function(){

    setTimeout(function(){

        const splash=document.getElementById("splash");

        splash.style.opacity="0";

        setTimeout(function(){

            splash.remove();

        },800);

    },1000);

});

</script>
</body>
</html>
